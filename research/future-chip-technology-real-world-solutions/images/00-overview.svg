<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="t d"><title id="t">How chips address real-world challenges</title><desc id="d">Eight application areas include energy, health, transport, water, resilience, edge AI, security and future computing architectures.</desc><rect width="1200" height="760" rx="26" fill="#0b1d36"/><g font-family="Arial,Helvetica,sans-serif"><text x="48" y="58" font-size="24" font-weight="bold" fill="#65e0d1">SEMICONDUCTOR RESEARCH • VISUAL FIELD GUIDE</text><text x="48" y="117" font-size="43" font-weight="bold" fill="#f3f8ff">From Chip Architecture to Real-World Impact</text><text x="48" y="157" font-size="21" fill="#c6d9ea">Sensors + processing + communication + control make systems useful</text><rect x="42" y="209" width="274" height="190" rx="19" fill="#183451" stroke="#59e4ac" stroke-width="2"/><circle cx="91" cy="259" r="27" fill="#59e4ac" fill-opacity=".16" stroke="#59e4ac" stroke-width="2.3"/><text x="91" y="269" text-anchor="middle" font-size="27" font-weight="bold" fill="#59e4ac">1</text><text x="64" y="322" font-size="19" font-weight="bold" fill="#f3f8ff">Energy &amp; Sustainable Computing</text><text x="64" y="359" font-size="15" fill="#c6d9ea">AI accelerator → Efficient output</text><rect x="334" y="209" width="274" height="190" rx="19" fill="#183451" stroke="#ff8eaa" stroke-width="2"/><circle cx="383" cy="259" r="27" fill="#ff8eaa" fill-opacity=".16" stroke="#ff8eaa" stroke-width="2.3"/><text x="383" y="269" text-anchor="middle" font-size="27" font-weight="bold" fill="#ff8eaa">2</text><text x="356" y="322" font-size="19" font-weight="bold" fill="#f3f8ff">Healthcare &amp; Diagnostics</text><text x="356" y="359" font-size="15" fill="#c6d9ea">Low-power chip → Clinician review</text><rect x="626" y="209" width="274" height="190" rx="19" fill="#183451" stroke="#ffc272" stroke-width="2"/><circle cx="675" cy="259" r="27" fill="#ffc272" fill-opacity=".16" stroke="#ffc272" stroke-width="2.3"/><text x="675" y="269" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffc272">3</text><text x="648" y="322" font-size="19" font-weight="bold" fill="#f3f8ff">Electric &amp; Safer Transportation</text><text x="648" y="359" font-size="15" fill="#c6d9ea">Power device → Motor / warning</text><rect x="918" y="209" width="274" height="190" rx="19" fill="#183451" stroke="#66d8fa" stroke-width="2"/><circle cx="967" cy="259" r="27" fill="#66d8fa" fill-opacity=".16" stroke="#66d8fa" stroke-width="2.3"/><text x="967" y="269" text-anchor="middle" font-size="27" font-weight="bold" fill="#66d8fa">4</text><text x="940" y="322" font-size="19" font-weight="bold" fill="#f3f8ff">Water &amp; Smart Agriculture</text><text x="940" y="359" font-size="15" fill="#c6d9ea">Control algorithm → Valve driver</text><rect x="42" y="427" width="274" height="190" rx="19" fill="#183451" stroke="#ffbb78" stroke-width="2"/><circle cx="91" cy="477" r="27" fill="#ffbb78" fill-opacity=".16" stroke="#ffbb78" stroke-width="2.3"/><text x="91" y="487" text-anchor="middle" font-size="27" font-weight="bold" fill="#ffbb78">5</text><text x="64" y="540" font-size="19" font-weight="bold" fill="#f3f8ff">Disaster &amp; Infrastructure Monitoring</text><text x="64" y="577" font-size="15" fill="#c6d9ea">Anomaly model → Alert system</text><rect x="334" y="427" width="274" height="190" rx="19" fill="#183451" stroke="#a6a3ff" stroke-width="2"/><circle cx="383" cy="477" r="27" fill="#a6a3ff" fill-opacity=".16" stroke="#a6a3ff" stroke-width="2.3"/><text x="383" y="487" text-anchor="middle" font-size="27" font-weight="bold" fill="#a6a3ff">6</text><text x="356" y="540" font-size="19" font-weight="bold" fill="#f3f8ff">Affordable Offline AI</text><text x="356" y="577" font-size="15" fill="#c6d9ea">On-device NPU → Private local result</text><rect x="626" y="427" width="274" height="190" rx="19" fill="#183451" stroke="#7de7d5" stroke-width="2"/><circle cx="675" cy="477" r="27" fill="#7de7d5" fill-opacity=".16" stroke="#7de7d5" stroke-width="2.3"/><text x="675" y="487" text-anchor="middle" font-size="27" font-weight="bold" fill="#7de7d5">7</text><text x="648" y="540" font-size="19" font-weight="bold" fill="#f3f8ff">Hardware Security &amp; Trust</text><text x="648" y="577" font-size="15" fill="#c6d9ea">PQC operations → Verified device</text><rect x="918" y="427" width="274" height="190" rx="19" fill="#183451" stroke="#d69eff" stroke-width="2"/><circle cx="967" cy="477" r="27" fill="#d69eff" fill-opacity=".16" stroke="#d69eff" stroke-width="2.3"/><text x="967" y="487" text-anchor="middle" font-size="27" font-weight="bold" fill="#d69eff">8</text><text x="940" y="540" font-size="19" font-weight="bold" fill="#f3f8ff">Next-Generation Chip Architectures</text><text x="940" y="577" font-size="15" fill="#c6d9ea">Optical links → Memory nearby</text><text x="48" y="689" font-size="24" font-weight="bold" fill="#77e7cc">Design for energy, safety, accuracy, affordability and trust.</text><text x="48" y="722" font-size="18" fill="#c0d5e8">Application diagrams are conceptual research pathways, not measured device performance.</text></g></svg>