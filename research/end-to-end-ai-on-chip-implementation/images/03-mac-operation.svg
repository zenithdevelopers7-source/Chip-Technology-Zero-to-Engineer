<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Multiply-accumulate: the basic AI operation</title><desc id="desc">Two signed INT8 products, accumulated into a signed 32-bit result</desc><rect width="1200" height="780" rx="24" fill="#0a1b33"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="56" font-size="23" fill="#edb77e" font-weight="bold">AI SEMICONDUCTOR ENGINEERING / VISUAL IMPLEMENTATION</text><text x="50" y="113" font-size="41" fill="#f4faff" font-weight="bold">Multiply-accumulate: the basic AI operation</text><text x="50" y="154" font-size="22" fill="#bcd8e8">Two signed INT8 products, accumulated into a signed 32-bit result</text><rect x="40" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="88" cy="278" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="88" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">1</text><text x="68" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">Inputs: [2, -3]</text><path d="M407 316h23m-9-8l9 8-9 8" fill="none" stroke="#edb77e" stroke-width="4"/><rect x="433" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="481" cy="278" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="481" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">2</text><text x="461" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">Weights: [4, 5]</text><path d="M800 316h23m-9-8l9 8-9 8" fill="none" stroke="#edb77e" stroke-width="4"/><rect x="826" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="874" cy="278" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="874" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">3</text><text x="854" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">Multiply: 2×4 = 8</text><rect x="40" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="88" cy="502" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="88" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">4</text><text x="68" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">Multiply: -3×5 = -15</text><path d="M407 540h23m-9-8l9 8-9 8" fill="none" stroke="#edb77e" stroke-width="4"/><rect x="433" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="481" cy="502" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="481" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">5</text><text x="461" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">Accumulate: 8 - 15</text><path d="M800 540h23m-9-8l9 8-9 8" fill="none" stroke="#edb77e" stroke-width="4"/><rect x="826" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#edb77e" stroke-width="2"/><circle cx="874" cy="502" r="27" fill="#edb77e" fill-opacity=".16" stroke="#edb77e" stroke-width="2"/><text x="874" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#edb77e">6</text><text x="854" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">Final result: -7</text><rect x="40" y="692" width="1120" height="58" rx="14" fill="#254760"/><text x="63" y="728" font-size="20" fill="#e1f3ff">Arithmetic correctness must be checked with negative values and overflow edge cases.</text></g></svg>