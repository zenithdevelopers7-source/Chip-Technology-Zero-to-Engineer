<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" role="img" aria-labelledby="title desc"><title id="title">Chip validation lifecycle</title><desc id="desc">Each phase needs independent evidence before making performance claims</desc><rect width="1200" height="780" rx="24" fill="#0a1b33"/><g font-family="Arial,Helvetica,sans-serif"><text x="50" y="56" font-size="23" fill="#ad9cf4" font-weight="bold">AI SEMICONDUCTOR ENGINEERING / VISUAL IMPLEMENTATION</text><text x="50" y="113" font-size="41" fill="#f4faff" font-weight="bold">Chip validation lifecycle</text><text x="50" y="154" font-size="22" fill="#bcd8e8">Each phase needs independent evidence before making performance claims</text><rect x="40" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="88" cy="278" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="88" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">1</text><text x="68" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">Python golden reference</text><path d="M407 316h23m-9-8l9 8-9 8" fill="none" stroke="#ad9cf4" stroke-width="4"/><rect x="433" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="481" cy="278" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="481" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">2</text><text x="461" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">RTL simulation +</text><text x="461" y="370" font-size="25" fill="#f3f8ff" font-weight="bold">waveforms</text><path d="M800 316h23m-9-8l9 8-9 8" fill="none" stroke="#ad9cf4" stroke-width="4"/><rect x="826" y="228" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="874" cy="278" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="874" y="288" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">3</text><text x="854" y="339" font-size="25" fill="#f3f8ff" font-weight="bold">Lint + synthesis</text><rect x="40" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="88" cy="502" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="88" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">4</text><text x="68" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">Static timing + target</text><path d="M407 540h23m-9-8l9 8-9 8" fill="none" stroke="#ad9cf4" stroke-width="4"/><rect x="433" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="481" cy="502" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="481" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">5</text><text x="461" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">FPGA board benchmark</text><path d="M800 540h23m-9-8l9 8-9 8" fill="none" stroke="#ad9cf4" stroke-width="4"/><rect x="826" y="452" width="365" height="178" rx="20" fill="#173756" stroke="#ad9cf4" stroke-width="2"/><circle cx="874" cy="502" r="27" fill="#ad9cf4" fill-opacity=".16" stroke="#ad9cf4" stroke-width="2"/><text x="874" y="512" text-anchor="middle" font-size="28" font-weight="bold" fill="#ad9cf4">6</text><text x="854" y="563" font-size="25" fill="#f3f8ff" font-weight="bold">ASIC sign-off (optional)</text><rect x="40" y="692" width="1120" height="58" rx="14" fill="#254760"/><text x="63" y="728" font-size="20" fill="#e1f3ff">Measured hardware performance is not established by simulation-only results.</text></g></svg>