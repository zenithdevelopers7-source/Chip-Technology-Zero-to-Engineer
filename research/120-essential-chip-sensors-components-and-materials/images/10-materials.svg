<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Semiconductor Materials visual guide</title><desc id="d">Ten examples: Silicon (Si), Germanium (Ge), Gallium nitride (GaN), Silicon carbide (SiC), Gallium arsenide (GaAs), Indium phosphide (InP), Silicon dioxide (SiO2), Hafnium dioxide (HfO2), Copper (Cu), Tungsten (W)</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#8fdea1" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 10</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Semiconductor Materials</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Silicon (Si)</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: CMOS processors, memory</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Germanium (Ge)</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: SiGe devices, photonics</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Gallium nitride (GaN)</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Power electronics, RF</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Silicon carbide (SiC)</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: EV power modules</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Gallium arsenide (GaAs)</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Radio, photonics</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Indium phosphide (InP)</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Optical communications</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Silicon dioxide (SiO2)</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: CMOS processing</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Hafnium dioxide (HfO2)</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Advanced transistors</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Copper (Cu)</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Chip wiring</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#8fdea1" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#8fdea1" fill="#8fdea1" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#8fdea1">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Tungsten (W)</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Integrated circuits</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>