<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Computing and Processing Chips visual guide</title><desc id="d">Ten examples: CPU, GPU, NPU, TPU, Microcontroller (MCU), Microprocessor (MPU), Digital signal processor (DSP), FPGA, ASIC, System-on-Chip (SoC)</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#aaa0ff" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 05</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Computing and Processing Chips</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">CPU</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Computers, servers</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">GPU</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Graphics, AI</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">NPU</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: AI phones, edge devices</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">TPU</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: AI systems</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Microcontroller (MCU)</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Appliances, sensors</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Microprocessor (MPU)</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Embedded computers</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Digital signal processor (DSP)</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Communications, audio</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">FPGA</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Prototyping, industrial systems</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">ASIC</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Networking, accelerators</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#aaa0ff" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#aaa0ff" fill="#aaa0ff" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#aaa0ff">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">System-on-Chip (SoC)</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Phones, smart devices</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>