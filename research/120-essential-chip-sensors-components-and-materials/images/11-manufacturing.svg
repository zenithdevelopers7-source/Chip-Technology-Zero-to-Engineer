<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Manufacturing Materials and Structures visual guide</title><desc id="d">Ten examples: Silicon wafer, Photoresist, Photomask, Doped silicon, Polysilicon, Silicon nitride, Low-k dielectric, Metal interconnect, Through-silicon via (TSV), Package substrate</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#d5a9fe" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 11</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Manufacturing Materials and Structures</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Silicon wafer</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Semiconductor factories</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Photoresist</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Lithography</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Photomask</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Chip manufacturing</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Doped silicon</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Transistors, junctions</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Polysilicon</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Gates, resistors</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Silicon nitride</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Fabrication layers</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Low-k dielectric</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Advanced chip interconnects</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Metal interconnect</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Integrated circuits</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Through-silicon via (TSV)</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: 3D integration</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#d5a9fe" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#d5a9fe" fill="#d5a9fe" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#d5a9fe">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Package substrate</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Chip packaging</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>