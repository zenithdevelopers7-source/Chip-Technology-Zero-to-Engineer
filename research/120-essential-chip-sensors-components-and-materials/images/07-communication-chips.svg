<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Communications, Network and Security Chips visual guide</title><desc id="d">Ten examples: Wi-Fi chip, Bluetooth chip, Cellular modem, GNSS receiver, Ethernet PHY, Network switch ASIC, RF transceiver, NFC controller, Secure element, Hardware security processor</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#8bd0ff" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 07</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Communications, Network and Security Chips</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Wi-Fi chip</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Routers, phones</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Bluetooth chip</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Headphones, wearables</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Cellular modem</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Phones, IoT</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">GNSS receiver</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Navigation</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Ethernet PHY</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Switches, computers</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Network switch ASIC</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Data centres</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">RF transceiver</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Wireless devices</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">NFC controller</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Contactless payments</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Secure element</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Payments, identity</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#8bd0ff" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#8bd0ff" fill="#8bd0ff" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#8bd0ff">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Hardware security processor</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Servers, secure systems</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>