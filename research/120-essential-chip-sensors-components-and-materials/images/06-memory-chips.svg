<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Memory and Storage Chips visual guide</title><desc id="d">Ten examples: SRAM, DRAM, NAND flash, NOR flash, EEPROM, ROM, HBM, MRAM, FRAM, Memory controller IC</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#f8c17e" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 06</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Memory and Storage Chips</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">SRAM</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: CPU caches</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">DRAM</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Computer memory</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">NAND flash</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: SSDs, phones</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">NOR flash</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Firmware storage</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">EEPROM</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Configuration data</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">ROM</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Embedded devices</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">HBM</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: AI GPUs</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">MRAM</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Specialized nonvolatile memory</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">FRAM</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Low-power embedded systems</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f8c17e" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#f8c17e" fill="#f8c17e" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f8c17e">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Memory controller IC</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Computing systems</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>