<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Power Management and Analog Chips visual guide</title><desc id="d">Ten examples: PMIC, Voltage regulator IC, Battery-management IC, Motor-driver IC, Gate-driver IC, ADC, DAC, Operational amplifier IC, Comparator IC, Clock-generation IC</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#c3b0f0" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 08</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Power Management and Analog Chips</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#c3b0f0" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#c3b0f0" fill="#c3b0f0" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#c3b0f0">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">PMIC</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Phones, processors</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#c3b0f0" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#c3b0f0" fill="#c3b0f0" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#c3b0f0">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Voltage regulator IC</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Electronic devices</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#c3b0f0" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#c3b0f0" fill="#c3b0f0" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fil