<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Industrial, Chemical and Agricultural Sensors visual guide</title><desc id="d">Ten examples: Soil-moisture sensor, pH sensor, Gas sensor, Carbon dioxide sensor, Particulate-matter sensor, Flow sensor, Level sensor, Strain gauge, Hall-effect sensor, Current sensor</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#92d5ac" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 04</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Industrial, Chemical and Agricultural Sensors</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Soil-moisture sensor</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Smart irrigation</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">pH sensor</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Water testing</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Gas sensor</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Safety systems</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Carbon dioxide sensor</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Air-quality control</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Particulate-matter sensor</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Air monitoring</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Flow sensor</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Pipelines</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Level sensor</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Water tanks</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Strain gauge</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Structural monitoring</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Hall-effect sensor</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Motor position, current sensing</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#92d5ac" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#92d5ac" fill="#92d5ac" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#92d5ac">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Current sensor</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Power systems</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>