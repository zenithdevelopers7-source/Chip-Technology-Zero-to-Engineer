<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Optical, Imaging and Distance Sensors visual guide</title><desc id="d">Ten examples: CMOS image sensor, CCD image sensor, Infrared sensor, Thermal imaging sensor, LiDAR sensor, Time-of-flight sensor, Photodiode, Phototransistor, UV sensor, Optical fingerprint sensor</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#78c8ef" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 02</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Optical, Imaging and Distance Sensors</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">CMOS image sensor</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Cameras, phones</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">CCD image sensor</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Scientific imaging</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Infrared sensor</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Remote controls, detection</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Thermal imaging sensor</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Fire monitoring, inspection</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">LiDAR sensor</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Robotics, mapping</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Time-of-flight sensor</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: 3D cameras</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Photodiode</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Optical receivers</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Phototransistor</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Optical switches</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">UV sensor</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Environmental monitoring</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#78c8ef" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#78c8ef" fill="#78c8ef" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#78c8ef">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Optical fingerprint sensor</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Biometric devices</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>