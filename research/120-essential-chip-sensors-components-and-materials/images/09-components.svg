<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Fundamental Electronic Components visual guide</title><desc id="d">Ten examples: Resistor, Capacitor, Inductor, Diode, LED, BJT transistor, MOSFET, Thyristor / SCR, Crystal resonator, Transformer</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#f2b392" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 09</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Fundamental Electronic Components</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Resistor</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Electronic circuits</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">Capacitor</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Power supplies, timing</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Inductor</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Converters, filters</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Diode</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Rectifiers, protection</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">LED</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Displays, indicators</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">BJT transistor</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Amplifiers, switching</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">MOSFET</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: CPUs, power switches</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Thyristor / SCR</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Industrial power control</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Crystal resonator</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Clock circuits</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f2b392" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#f2b392" fill="#f2b392" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f2b392">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Transformer</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Power conversion</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>