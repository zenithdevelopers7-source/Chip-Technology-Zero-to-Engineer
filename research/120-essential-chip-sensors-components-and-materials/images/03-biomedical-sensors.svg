<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="680" viewBox="0 0 1200 680" role="img" aria-labelledby="t d"><title id="t">Medical and Biological Sensors visual guide</title><desc id="d">Ten examples: ECG sensor system, EEG sensor system, EMG sensor system, Pulse oximetry sensor, Continuous glucose sensor, Bioimpedance sensor, Electrochemical biosensor, Microfluidic sensing chip, PPG sensor, Implantable pressure sensor</desc><rect width="1200" height="680" rx="24" fill="#0a1c33"/><g font-family="Arial,Helvetica,sans-serif"><text x="45" y="56" font-size="22" fill="#f49aae" font-weight="bold">CHIP TECHNOLOGY • CATEGORY 03</text><text x="45" y="115" font-size="43" fill="#f4f8ff" font-weight="bold">Medical and Biological Sensors</text><text x="45" y="152" font-size="21" fill="#bcd5e7">The function and the real-world device — 10 examples</text><rect x="33" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="63" cy="215" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="63" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">1</text><text x="94" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">ECG sensor system</text><text x="94" y="243" font-size="17" fill="#c2d7e7">Used: Heart monitors</text><rect x="615" y="186" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="645" cy="215" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="645" y="221" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">2</text><text x="676" y="216" font-size="20" fill="#f4f8ff" font-weight="bold">EEG sensor system</text><text x="676" y="243" font-size="17" fill="#c2d7e7">Used: Neurological monitoring</text><rect x="33" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="63" cy="304" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="63" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">3</text><text x="94" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">EMG sensor system</text><text x="94" y="332" font-size="17" fill="#c2d7e7">Used: Rehabilitation, prosthetics</text><rect x="615" y="275" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="645" cy="304" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="645" y="310" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">4</text><text x="676" y="305" font-size="20" fill="#f4f8ff" font-weight="bold">Pulse oximetry sensor</text><text x="676" y="332" font-size="17" fill="#c2d7e7">Used: Medical monitors</text><rect x="33" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="63" cy="393" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="63" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">5</text><text x="94" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Continuous glucose sensor</text><text x="94" y="421" font-size="17" fill="#c2d7e7">Used: Diabetes management</text><rect x="615" y="364" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="645" cy="393" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="645" y="399" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">6</text><text x="676" y="394" font-size="20" fill="#f4f8ff" font-weight="bold">Bioimpedance sensor</text><text x="676" y="421" font-size="17" fill="#c2d7e7">Used: Body monitoring</text><rect x="33" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="63" cy="482" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="63" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">7</text><text x="94" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Electrochemical biosensor</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Diagnostic tests</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Microfluidic sensing chip</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Lab-on-chip diagnostics</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">PPG sensor</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Smartwatches</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#f49aae" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#f49aae" fill="#f49aae" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#f49aae">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Implantable pressure sensor</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Specialized implants</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>