old">Magnetometer</text><text x="94" y="510" font-size="17" fill="#c2d7e7">Used: Digital compasses</text><rect x="615" y="453" width="558" height="76" rx="12" fill="#193a57" stroke="#76dbce" stroke-opacity=".65"/><circle cx="645" cy="482" r="19" stroke="#76dbce" fill="#76dbce" fill-opacity=".13"/><text x="645" y="488" text-anchor="middle" font-size="17" font-weight="bold" fill="#76dbce">8</text><text x="676" y="483" font-size="20" fill="#f4f8ff" font-weight="bold">Proximity sensor</text><text x="676" y="510" font-size="17" fill="#c2d7e7">Used: Phones, robots</text><rect x="33" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#76dbce" stroke-opacity=".65"/><circle cx="63" cy="571" r="19" stroke="#76dbce" fill="#76dbce" fill-opacity=".13"/><text x="63" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#76dbce">9</text><text x="94" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Ambient light sensor</text><text x="94" y="599" font-size="17" fill="#c2d7e7">Used: Automatic screen brightness</text><rect x="615" y="542" width="558" height="76" rx="12" fill="#193a57" stroke="#76dbce" stroke-opacity=".65"/><circle cx="645" cy="571" r="19" stroke="#76dbce" fill="#76dbce" fill-opacity=".13"/><text x="645" y="577" text-anchor="middle" font-size="17" font-weight="bold" fill="#76dbce">10</text><text x="676" y="572" font-size="20" fill="#f4f8ff" font-weight="bold">Vibration sensor</text><text x="676" y="599" font-size="17" fill="#c2d7e7">Used: Machine maintenance</text><text x="45" y="666" font-size="18" fill="#a6c3d7">Educational application map, not a complete device circuit diagram</text></g></svg>