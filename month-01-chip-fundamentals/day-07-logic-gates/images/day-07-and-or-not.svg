<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="t d"><title id="t">Day 7 - AND, OR and NOT gates</title><desc id="d">Three logic gate schematics and truth tables for beginner electronics study</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071529"/><stop offset="1" stop-color="#1a466c"/></linearGradient></defs><rect width="1200" height="750" rx="28" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f5f8fd"><text x="43" y="52" font-size="22" font-weight="700" fill="#68e6d2">CHIP TECHNOLOGY • DAY 007</text><text x="43" y="108" font-size="42" font-weight="700">AND, OR &amp; NOT digital logic gates</text><text x="43" y="148" font-size="23" fill="#b9d5e7">The building blocks that let circuits make binary decisions</text><rect x="38" y="180" width="357" height="510" rx="21" fill="#142d49" stroke="#527a9a"/><text x="66" y="226" font-size="32" font-weight="700" fill="#69c6f2">AND</text><text x="66" y="263" font-size="16" fill="#c9d8e7">Output 1 only when A and B are 1</text><path d="M90 307H157 M90 359H157 M156 275H214Q290 275 290 334Q290 393 214 393H156Z M290 334H339" fill="#233f5f" stroke="#69c6f2" stroke-width="4"/><text x="73" y="458" font-size="21" font-weight="700">Truth table</text><rect x="62" y="472" width="308" height="42" rx="8" fill="#284968"/><text x="106" y="500" font-size="18">A</text><text x="190" y="500" font-size="18">B</text><text x="290" y="500" font-size="18">OUT</text><text x="106" y="545" font-size="20">0</text><text x="190" y="545" font-size="20">0</text><text x="298" y="545" font-size="20" fill="#d4dfeb">0</text><text x="106" y="578" font-size="20">0</text><text x="190" y="578" font-size="20">1</text><text x="298" y="578" font-size="20" fill="#d4dfeb">0</text><text x="106" y="611" font-size="20">1</text><text x="190" y="611" font-size="20">0</text><text x="298" y="611" font-size="20" fill="#d4dfeb">0</text><text x="106" y="644" font-size="20">1</text><text x="190" y="644" font-size="20">1</text><text x="298" y="644" font-size="20" fill="#70eed9">1</text><rect x="421" y="180" width="357" height="510" rx="21" fill="#142d49" stroke="#527a9a"/><text x="449" y="226" font-size="32" font-weight="700" fill="#d2a3ff">OR</text><text x="449" y="263" font-size="16" fill="#c9d8e7">Output 1 when either input is 1</text><path d="M473 307H533 M473 359H533 M530 275Q563 334 530 393Q628 393 681 334Q628 275 530 275Z M681 334H728" fill="#233f5f" stroke="#d2a3ff" stroke-width="4"/><text x="456" y="458" font-size="21" font-weight="700">Truth table</text><rect x="445" y="472" width="308" height="42" rx="8" fill="#284968"/><text x="489" y="500" font-size="18">A</text><text x="573" y="500" font-size="18">B</text><text x="673" y="500" font-size="18">OUT</text><text x="489" y="545" font-size="20">0</text><text x="573" y="545" font-size="20">0</text><text x="681" y="545" font-size="20" fill="#d4dfeb">0</text><text x="489" y="578" font-size="20">0</text><text x="573" y="578" font-size="20">1</text><text x="681" y="578" font-size="20" fill="#70eed9">1</text><text x="489" y="611" font-size="20">1</text><text x="573" y="611" font-size="20">0</text><text x="681" y="611" font-size="20" fill="#70eed9">1</text><text x="489" y="644" font-size="20">1</text><text x="573" y="644" font-size="20">1</text><text x="681" y="644" font-size="20" fill="#70eed9">1</text><rect x="804" y="180" width="357" height="510" rx="21" fill="#142d49" stroke="#527a9a"/><text x="832" y="226" font-size="32" font-weight="700" fill="#ffc574">NOT</text><text x="832" y="263" font-size="16" fill="#c9d8e7">Output is opposite of A</text><path d="M859 334H931 M931 277L931 391L1044 334Z" fill="#233f5f" stroke="#ffc574" stroke-width="4"/><circle cx="1056" cy="334" r="12" fill="#142d49" stroke="#ffc574" stroke-width="4"/><path d="M1068 334H1113" stroke="#ffc574" stroke-width="4"/><text x="839" y="458" font-size="21" font-weight="700">Truth table</text><rect x="828" y="472" width="308" height="42" rx="8" fill="#284968"/><text x="872" y="500" font-size="18">A</text><text x="956" y="500" font-size="18">B</text><text x="1056" y="500" font-size="18">OUT</text><text x="872" y="545" font-size="20">0</text><text x="956" y="545" font-size="20">—</text><text x="1064" y="545" font-size="20" fill="#70eed9">1</text><text x="872" y="578" font-size="20">1</text><text x="956" y="578" font-size="20">—</text><text x="1064" y="578" font-size="20" fill="#d4dfeb">0</text><text x="44" y="731" font-size="17" fill="#bdd1e3">Logic diagrams are idealized symbols; physical circuits use transistors to implement these functions.</text></g></svg>