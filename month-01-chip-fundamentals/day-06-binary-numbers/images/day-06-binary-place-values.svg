<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="t d"><title id="t">Day 6: Binary Numbers</title><desc id="d">Diagram showing the binary digits 00001101, their place values, and conversion into decimal 13</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#07172e"/><stop offset="1" stop-color="#19466d"/></linearGradient></defs><rect width="1200" height="700" rx="26" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f4f8ff"><text x="44" y="55" font-size="24" font-weight="bold" fill="#6ce7d3">CHIP TECHNOLOGY • DAY 006</text><text x="44" y="115" font-size="44" font-weight="bold">How chips represent numbers using bits</text><text x="44" y="157" font-size="23" fill="#bad4e7">An 8-bit example: 00001101 in binary equals 13 in decimal</text><rect x="36" y="193" width="1128" height="282" rx="20" fill="#112d4d" stroke="#4d789d"/><text x="65" y="241" font-size="25" font-weight="bold">Bit position (left to right):</text><text x="64" y="292" font-size="19" fill="#bbd4e7">Place value</text><rect x="207" y="265" width="93" height="128" rx="12" fill="#243f60" stroke="#56789a" stroke-width="2"/><text x="253" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">128</text><text x="253" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#f1f7ff">0</text><rect x="324" y="265" width="93" height="128" rx="12" fill="#243f60" stroke="#56789a" stroke-width="2"/><text x="370" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">64</text><text x="370" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#f1f7ff">0</text><rect x="441" y="265" width="93" height="128" rx="12" fill="#243f60" stroke="#56789a" stroke-width="2"/><text x="487" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">32</text><text x="487" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#f1f7ff">0</text><rect x="558" y="265" width="93" height="128" rx="12" fill="#243f60" stroke="#56789a" stroke-width="2"/><text x="604" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">16</text><text x="604" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#f1f7ff">0</text><rect x="675" y="265" width="93" height="128" rx="12" fill="#185d64" stroke="#4ce7c7" stroke-width="2"/><text x="721" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">8</text><text x="721" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#6bffdc">1</text><rect x="792" y="265" width="93" height="128" rx="12" fill="#185d64" stroke="#4ce7c7" stroke-width="2"/><text x="838" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">4</text><text x="838" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#6bffdc">1</text><rect x="909" y="265" width="93" height="128" rx="12" fill="#243f60" stroke="#56789a" stroke-width="2"/><text x="955" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">2</text><text x="955" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#f1f7ff">0</text><rect x="1026" y="265" width="93" height="128" rx="12" fill="#185d64" stroke="#4ce7c7" stroke-width="2"/><text x="1072" y="297" font-family="Arial" font-size="20" text-anchor="middle" fill="#b6cee6">1</text><text x="1072" y="368" font-family="Arial" font-size="57" font-weight="bold" text-anchor="middle" fill="#6bffdc">1</text><text x="64" y="443" font-size="23" fill="#c8e1f2">Only positions containing 1 contribute to the total.</text><rect x="36" y="500" width="1128" height="139" rx="20" fill="#173b5d" stroke="#4d789d"/><text x="64" y="551" font-size="30" font-weight="bold">8 + 4 + 1 = 13</text><text x="64" y="600" font-size="25" fill="#75edd7">Binary 00001101 = Decimal 13</text><text x="44" y="675" font-size="18" fill="#bbd4e7">Binary uses only two digits, 0 and 1. Position determines each bit's value.</text></g></svg>