<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="700" viewBox="0 0 1200 700" role="img" aria-labelledby="title desc"><title id="title">Day 2: Voltage, current and resistance</title><desc id="desc">Beginner semiconductor learning illustration for Electricity fundamentals  •  Ohm's law</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#071629"/><stop offset="1" stop-color="#1c466d"/></linearGradient></defs><rect width="1200" height="700" rx="26" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f3f8ff"><text x="42" y="49" font-size="21" font-weight="bold" fill="#42d8c1">CHIP TECHNOLOGY • DAY 002</text><text x="42" y="108" font-size="43" font-weight="bold">Voltage, current and resistance</text><text x="43" y="147" font-size="21" fill="#b9d2e8">Electricity fundamentals  •  Ohm's law</text>
<rect x="45" y="170" width="705" height="370" rx="22" fill="#142b48" stroke="#3a6184"/>
<text x="83" y="225" font-size="26" font-weight="bold">A simple resistor circuit</text>
<path d="M188 310H360M490 310H628V460H188V310" fill="none" stroke="#b7d4ed" stroke-width="8" stroke-linecap="round"/>
<circle cx="188" cy="385" r="36" fill="#193f64" stroke="#40d6c0" stroke-width="6"/>
<text x="188" y="393" font-size="24" text-anchor="middle" font-weight="bold">5 V</text>
<path d="M360 310l16 -24 17 48 18 -48 18 48 18 -48 17 24h26" fill="none" stroke="#ffc66a" stroke-width="7" stroke-linejoin="round"/>
<text x="425" y="271" text-anchor="middle" font-size="27" fill="#ffc66a">1000 Ω resistor</text>
<path d="M567 452h-100" stroke="#42d8c1" stroke-width="7" stroke-linecap="round"/><path d="M480 437l-22 15 22 15" fill="none" stroke="#42d8c1" stroke-width="6"/>
<text x="428" y="502" font-size="22" fill="#42d8c1">Current flows around a closed loop</text>
<rect x="782" y="170" width="374" height="370" rx="22" fill="#142b48" stroke="#3a6184"/>
<text x="816" y="229" font-size="28" font-weight="bold">Ohm's law</text>
<text x="969" y="333" text-anchor="middle" font-size="73" font-weight="bold" fill="#ffc66a">I = V / R</text>
<text x="969" y="392" text-anchor="middle" font-size="26">5 / 1000 = 0.005 A</text>
<text x="969" y="449" text-anchor="middle" font-size="43" font-weight="bold" fill="#42d8c1">5 mA</text>
<text x="62" y="607" font-size="26" font-weight="bold">V = voltage (volts)     I = current (amps)     R = resistance (ohms)</text>
<text x="62" y="652" font-size="19" fill="#bdd0df">A simplified ideal resistor circuit, not a semiconductor device model.</text></g></svg>