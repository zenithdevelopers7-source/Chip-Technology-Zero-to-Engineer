<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Day 9 Half Adder Logic Circuit</title><desc id="desc">XOR and AND gates compute SUM and CARRY for the four input combinations 00 01 10 11</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#07172d"/><stop offset="1" stop-color="#194566"/></linearGradient></defs><rect width="1200" height="720" rx="24" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f3f7ff"><text x="42" y="49" font-size="22" font-weight="bold" fill="#69ebd1">CHIP TECHNOLOGY • DAY 009</text><text x="42" y="105" font-size="43" font-weight="bold">Half Adder: Your First Binary Addition Circuit</text><text x="42" y="148" font-size="22" fill="#bdd6e7">Two input bits • XOR makes SUM • AND makes CARRY</text><rect x="35" y="174" width="635" height="451" rx="22" fill="#122e4c" stroke="#4a7698"/><rect x="695" y="174" width="470" height="451" rx="22" fill="#122e4c" stroke="#4a7698"/><text x="65" y="222" font-size="27" font-weight="bold">Logic diagram</text><text x="722" y="222" font-size="27" font-weight="bold">Truth table</text><rect x="290" y="265" width="183" height="104" rx="17" fill="#164e76" stroke="#64cfff" stroke-width="4"/><rect x="290" y="441" width="183" height="104" rx="17" fill="#245d4f" stroke="#65e2b8" stroke-width="4"/><text x="381" y="327" text-anchor="middle" font-size="34" font-weight="bold">XOR</text><text x="381" y="505" text-anchor="middle" font-size="34" font-weight="bold">AND</text><path d="M109 313H203V289H290 M203 313V467H290 M109 387H245V344H290 M245 387V515H290 M473 317H559 M473 493H559" fill="none" stroke="#d0e0ed" stroke-width="6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="203" cy="313" r="7" fill="#64cfff"/><circle cx="245" cy="387" r="7" fill="#65e2b8"/><text x="76" y="308" font-size="27" font-weight="bold">A</text><text x="76" y="382" font-size="27" font-weight="bold">B</text><text x="570" y="324" font-size="24" font-weight="bold" fill="#64cfff">SUM</text><text x="570" y="499" font-size="24" font-weight="bold" fill="#65e2b8">CARRY</text><rect x="720" y="260" width="420" height="61" rx="10" fill="#295371"/><text x="754" y="300" font-size="24" font-weight="bold">A</text><text x="854" y="300" font-size="24" font-weight="bold">B</text><text x="947" y="300" font-size="24" font-weight="bold">SUM</text><text x="1060" y="300" font-size="24" font-weight="bold">C</text><text x="754" y="368" font-size="29">0</text><text x="854" y="368" font-size="29">0</text><text x="951" y="368" font-size="29" fill="#72d7ff">0</text><text x="1060" y="368" font-size="29" fill="#77e5b9">0</text><text x="754" y="425" font-size="29">0</text><text x="854" y="425" font-size="29">1</text><text x="951" y="425" font-size="29" fill="#72d7ff">1</text><text x="1060" y="425" font-size="29" fill="#77e5b9">0</text><text x="754" y="482" font-size="29">1</text><text x="854" y="482" font-size="29">0</text><text x="951" y="482" font-size="29" fill="#72d7ff">1</text><text x="1060" y="482" font-size="29" fill="#77e5b9">0</text><text x="754" y="539" font-size="29">1</text><text x="854" y="539" font-size="29">1</text><text x="951" y="539" font-size="29" fill="#72d7ff">0</text><text x="1060" y="539" font-size="29" fill="#77e5b9">1</text><text x="726" y="594" font-size="22" font-weight="bold" fill="#ffd07d">1 + 1 = binary 10 (decimal 2)</text><rect x="35" y="648" width="1130" height="45" rx="12" fill="#21466a"/><text x="59" y="678" font-size="23" font-weight="bold">Read the result as CARRY followed by SUM: 00, 01, 01, 10</text></g></svg>