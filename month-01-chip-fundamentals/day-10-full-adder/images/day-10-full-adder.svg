<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 720" role="img" aria-labelledby="title desc"><title id="title">Day 10 Full Adder Logic</title><desc id="desc">Two half adders combine with OR to compute full-adder sum and carry. Eight-row truth table.</desc><rect width="1200" height="720" rx="26" fill="#0d2341"/><g font-family="Arial,Helvetica,sans-serif" fill="#f1f8ff"><text x="45" y="52" font-size="22" fill="#76efd3" font-weight="bold">CHIP TECHNOLOGY • DAY 010</text><text x="45" y="108" font-size="44" font-weight="bold">Full Adder: Three Input Bits</text><text x="45" y="150" font-size="22">SUM = A XOR B XOR Cin    |    Cout = (A AND B) OR (Cin AND (A XOR B))</text><rect x="35" y="183" width="684" height="452" rx="21" fill="#153654" stroke="#5b84a8"/><text x="59" y="227" font-size="27" font-weight="bold">Two half adders + OR gate</text><rect x="165" y="295" width="185" height="103" rx="15" fill="#236483" stroke="#83d6fa" stroke-width="3"/><rect x="414" y="295" width="185" height="103" rx="15" fill="#236483" stroke="#83d6fa" stroke-width="3"/><rect x="414" y="477" width="185" height="84" rx="15" fill="#26644e" stroke="#7ce7ba" stroke-width="3"/><text x="257" y="351" text-anchor="middle" font-size="26" font-weight="bold">Half Adder 1</text><text x="507" y="351" text-anchor="middle" font-size="26" font-weight="bold">Half Adder 2</text><text x="507" y="531" text-anchor="middle" font-size="29" font-weight="bold">OR</text><path d="M100 315H165 M100 374H165 M350 330H414 M599 329H656 M350 377V500H414 M599 377V500 M599 520H655" stroke="#c8ddef" stroke-width="5" fill="none"/><path d="M377 273H399V371H414" stroke="#ffcc7a" stroke-width="5" fill="none"/><text x="72" y="310" font-size="23">A</text><text x="72" y="368" font-size="23">B</text><text x="366" y="267" font-size="23" fill="#ffcc7a">Cin</text><text x="662" y="336" font-size="22" fill="#91d6ff">SUM</text><text x="658" y="529" font-size="22" fill="#88efbc">Cout</text><rect x="744" y="183" width="422" height="452" rx="21" fill="#153654" stroke="#5b84a8"/><text x="764" y="227" font-size="27" font-weight="bold">Truth table</text><rect x="762" y="249" width="388" height="48" rx="9" fill="#2a5271"/><text x="782" y="281" font-size="21">A</text><text x="850" y="281" font-size="21">B</text><text x="917" y="281" font-size="21">Cin</text><text x="1001" y="281" font-size="21">SUM</text><text x="1094" y="281" font-size="21">Cout</text><text x="785" y="336" font-size="23">0</text><text x="852" y="336" font-size="23">0</text><text x="921" y="336" font-size="23">0</text><text x="1012" y="336" font-size="23" fill="#91d6ff">0</text><text x="1102" y="336" font-size="23" fill="#88efbc">0</text><text x="785" y="375" font-size="23">0</text><text x="852" y="375" font-size="23">0</text><text x="921" y="375" font-size="23">1</text><text x="1012" y="375" font-size="23" fill="#91d6ff">1</text><text x="1102" y="375" font-size="23" fill="#88efbc">0</text><text x="785" y="414" font-size="23">0</text><text x="852" y="414" font-size="23">1</text><text x="921" y="414" font-size="23">0</text><text x="1012" y="414" font-size="23" fill="#91d6ff">1</text><text x="1102" y="414" font-size="23" fill="#88efbc">0</text><text x="785" y="453" font-size="23">0</text><text x="852" y="453" font-size="23">1</text><text x="921" y="453" font-size="23">1</text><text x="1012" y="453" font-size="23" fill="#91d6ff">0</text><text x="1102" y="453" font-size="23" fill="#88efbc">1</text><text x="785" y="492" font-size="23">1</text><text x="852" y="492" font-size="23">0</text><text x="921" y="492" font-size="23">0</text><text x="1012" y="492" font-size="23" fill="#91d6ff">1</text><text x="1102" y="492" font-size="23" fill="#88efbc">0</text><text x="785" y="531" font-size="23">1</text><text x="852" y="531" font-size="23">0</text><text x="921" y="531" font-size="23">1</text><text x="1012" y="531" font-size="23" fill="#91d6ff">0</text><text x="1102" y="531" font-size="23" fill="#88efbc">1</text><text x="785" y="570" font-size="23">1</text><text x="852" y="570" font-size="23">1</text><text x="921" y="570" font-size="23">0</text><text x="1012" y="570" font-size="23" fill="#91d6ff">0</text><text x="1102" y="570" font-size="23" fill="#88efbc">1</text><text x="785" y="609" font-size="23">1</text><text x="852" y="609" font-size="23">1</text><text x="921" y="609" font-size="23">1</text><text x="1012" y="609" font-size="23" fill="#91d6ff">1</text><text x="1102" y="609" font-size="23" fill="#88efbc">1</text><text x="46" y="676" font-size="23" font-weight="bold">Example: A=1, B=1, Cin=1 → SUM=1, Cout=1 → binary 11 (decimal 3)</text></g></svg>