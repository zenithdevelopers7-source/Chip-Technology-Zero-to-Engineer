<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 700" role="img" aria-labelledby="title description"><title id="title">Day 5 - NMOS transistor switching</title><desc id="description">A conceptual transistor gate, source, drain diagram, together with a pull-up resistor and NMOS pull-down output truth table.</desc><defs><linearGradient id="background" x2="1" y2="1"><stop stop-color="#07142e"/><stop offset="1" stop-color="#183e67"/></linearGradient></defs><rect width="1200" height="700" rx="24" fill="url(#background)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f1f7ff"><text x="42" y="51" font-size="21" fill="#52dfcc" font-weight="bold">CHIP TECHNOLOGY - DAY 005</text><text x="42" y="107" font-size="40" font-weight="bold">How an NMOS transistor controls a circuit</text><text x="43" y="145" font-size="21" fill="#b5cee7">Gate voltage controls a conductive channel between source and drain</text><rect x="35" y="170" width="559" height="399" rx="19" fill="#152f50" stroke="#52789d"/><rect x="615" y="170" width="550" height="399" rx="19" fill="#152f50" stroke="#52789d"/><text x="62" y="216" font-size="27" font-weight="bold">Conceptual NMOS cross-section</text><rect x="89" y="345" width="436" height="150" rx="8" fill="#9a7dc9" opacity=".65"/><text x="307" y="474" font-size="20" text-anchor="middle">P-type silicon body</text><rect x="112" y="348" width="112" height="68" rx="5" fill="#2f9bc3"/><rect x="390" y="348" width="112" height="68" rx="5" fill="#2f9bc3"/><text x="167" y="385" font-size="20" text-anchor="middle">N+ source</text><text x="446" y="385" font-size="20" text-anchor="middle">N+ drain</text><rect x="224" y="340" width="166" height="11" fill="#b5f6f0"/><text x="306" y="331" font-size="18" fill="#80e2d8" text-anchor="middle">Channel forms when ON</text><rect x="246" y="284" width="121" height="25" rx="3" fill="#ffcf77"/><rect x="246" y="314" width="121" height="12" rx="2" fill="#ffffff"/><path d="M306 265v-31" stroke="#ffc56c" stroke-width="4"/><text x="306" y="252" font-size="19" text-anchor="middle">Gate</text><text x="307" y="530" text-anchor="middle" font-size="18" fill="#c8d9e9">Simplified cross-section, not to scale</text><text x="643" y="216" font-size="27" font-weight="bold">NMOS pull-down circuit</text><path d="M840 251 V279" stroke="#bdd4eb" stroke-width="5"/><text x="840" y="245" font-size="19" text-anchor="middle">VDD (1)</text><path d="M840 279 l-15 14 30 15 -30 15 30 15 -15 14 v39" fill="none" stroke="#ffce75" stroke-width="5" stroke-linejoin="round"/><text x="887" y="323" font-size="18">Pull-up</text><circle cx="840" cy="391" r="7" fill="#4ce1ce"/><path d="M840 391H1005" stroke="#bdd4eb" stroke-width="5"/><text x="1015" y="397" font-size="21">Output</text><path d="M840 391v46" stroke="#bdd4eb" stroke-width="5"/><path d="M820 437v55 M860 437v55" stroke="#e6effa" stroke-width="6"/><path d="M781 465H815" stroke="#ffce75" stroke-width="5"/><text x="773" y="453" font-size="19" text-anchor="end">Gate</text><path d="M840 492v31 M815 523h50 M823 532h34 M831 541h18" stroke="#bdd4eb" stroke-width="4"/><text x="712" y="555" font-size="18" fill="#c8d9e9">NMOS pulls the output LOW when ON</text><rect x="35" y="586" width="1130" height="82" rx="16" fill="#21456a"/><text x="71" y="623" font-size="23" font-weight="bold">Gate = 0  |  NMOS OFF  |  Output = 1</text><text x="645" y="623" font-size="23" font-weight="bold">Gate = 1  |  NMOS ON  |  Output = 0</text><text x="72" y="651" font-size="17" fill="#c4d9ea">Idealized logic-level model. Real transistor behavior depends on voltages, threshold and device physics.</text></g></svg>