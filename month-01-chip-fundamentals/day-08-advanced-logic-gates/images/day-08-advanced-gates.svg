<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" role="img" aria-labelledby="title desc"><title id="title">Day 8 - NAND NOR XOR and XNOR truth tables</title><desc id="desc">Four color coded logic gate cards with truth tables for all four input combinations</desc><defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#071427"/><stop offset="1" stop-color="#1c426a"/></linearGradient></defs><rect width="1200" height="760" rx="27" fill="url(#bg)"/><g font-family="Arial,Helvetica,sans-serif" fill="#f0f7ff"><text x="42" y="52" font-size="23" font-weight="bold" fill="#61e1d5">CHIP TECHNOLOGY • DAY 008</text><text x="42" y="107" font-size="43" font-weight="bold">Beyond AND and OR: four useful logic gates</text><text x="42" y="148" font-size="22" fill="#bcd4e6">NAND • NOR • XOR • XNOR — read each output from its truth table</text><rect x="34" y="188" width="278" height="460" rx="22" fill="#142e4e" stroke="#597e9e"/><text x="58" y="238" font-size="34" font-weight="bold" fill="#78d7f5">NAND</text><text x="58" y="273" font-size="19" fill="#d2e0ee">NOT (A AND B)</text><rect x="56" y="309" width="234" height="52" rx="9" fill="#244866"/><text x="79" y="342" font-size="22">A</text><text x="146" y="342" font-size="22">B</text><text x="211" y="342" font-size="22">OUT</text><text x="79" y="408" font-size="25">0</text><text x="146" y="408" font-size="25">0</text><text x="221" y="408" font-size="25" font-weight="bold" fill="#78d7f5">1</text><text x="79" y="459" font-size="25">0</text><text x="146" y="459" font-size="25">1</text><text x="221" y="459" font-size="25" font-weight="bold" fill="#78d7f5">1</text><text x="79" y="510" font-size="25">1</text><text x="146" y="510" font-size="25">0</text><text x="221" y="510" font-size="25" font-weight="bold" fill="#78d7f5">1</text><text x="79" y="561" font-size="25">1</text><text x="146" y="561" font-size="25">1</text><text x="221" y="561" font-size="25" font-weight="bold" fill="#dde8f4">0</text><rect x="329" y="188" width="27