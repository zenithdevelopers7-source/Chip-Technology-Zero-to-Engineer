-size="25" font-weight="bold" fill="#f7bc7f">1</text><text x="669" y="561" font-size="25">1</text><text x="736" y="561" font-size="25">1</text><text x="811" y="561" font-size="25" font-weight="bold" fill="#dde8f4">0</text><rect x="919" y="188" width="278" height="460" rx="22" fill="#142e4e" stroke="#597e9e"/><text x="943" y="238" font-size="34" font-weight="bold" fill="#66e3b5">XNOR</text><text x="943" y="273" font-size="19" fill="#d2e0ee">1 when A and B match</text><rect x="941" y="309" width="234" height="52" rx="9" fill="#244866"/><text x="964" y="342" font-size="22">A</text><text x="1031" y="342" font-size="22">B</text><text x="1096" y="342" font-size="22">OUT</text><text x="964" y="408" font-size="25">0</text><text x="1031" y="408" font-size="25">0</text><text x="1106" y="408" font-size="25" font-weight="bold" fill="#66e3b5">1</text><text x="964" y="459" font-size="25">0</text><text x="1031" y="459" font-size="25">1</text><text x="1106" y="459" font-size="25" font-weight="bold" fill="#dde8f4">0</text><text x="964" y="510" font-size="25">1</text><text x="1031" y="510" font-size="25">0</text><text x="1106" y="510" font-size="25" font-weight="bold" fill="#dde8f4">0</text><text x="964" y="561" font-size="25">1</text><text x="1031" y="561" font-size="25">1</text><text x="1106" y="561" font-size="25" font-weight="bold" fill="#66e3b5">1</text><text x="44" y="693" font-size="24" font-weight="bold">Think: XOR detects differences; XNOR detects equality.</text><text x="44" y="729" font-size="18" fill="#bad2e7">Educational Boolean logic truth tables. A practical IC implements gates using transistor networks.</text></g></svg>